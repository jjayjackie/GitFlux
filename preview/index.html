<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitFlux preview</title>
    <link rel="icon" href="data:," />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      #root { display: flex; flex-direction: column; }
      /* As Paseo's page has it: text smoothed thinner (its index.html), and, once an Interface font is set, that font
         on every element outside its code views (apply-root-font.web.ts). */
      :root { --paseo-ui-font: -apple-system, system-ui, sans-serif; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      :is(#root, #overlay-root) *:not([data-pmono]):not([data-pmono] *) { font-family: var(--paseo-ui-font); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/preview.js"></script>
  </body>
</html>
