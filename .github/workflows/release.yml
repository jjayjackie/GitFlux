# Publishes a GitHub Release for a version tag (v<major>.<minor>.<patch>[-<pre-release>]), after every CI check has
# passed on the tagged commit. The release carries the two archives built by CI's package job and their SHA256SUMS.
# A tag with a pre-release suffix (v1.2.0-rc.1) makes a pre-release.

name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: The tag is v + package.json version
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error title=Tag and version differ::Tag ${TAG} does not match package.json version ${version}; tag the commit v${version} or bump the version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    # ci.yml's lockfile job declares contents: write (it pushes a regenerated lock on branch pushes only; on a tag it
    # fails when the lock is stale instead), and a called workflow may not ask for more than its caller grants.
    permissions:
      contents: write

  publish:
    name: publish release
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Download the package built by CI
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.ci.outputs.artifact }}
          path: dist
      - name: Check the archives against SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum --check SHA256SUMS
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          TESTED_SHA: ${{ needs.ci.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Releasing ${TAG} (version ${VERSION}), tested at ${TESTED_SHA}"
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Install from Git with Paseo, or download an archive below:

          - \`paseo-advanced-git-${VERSION}.tgz\`: the plugin source as installed from Git. Extract it, run \`npm ci --omit=dev\` in the extracted directory (the manifest's build step), then install that directory.
          - \`paseo-advanced-git-${VERSION}-bundled.tgz\`: the same with its production dependencies included, for hosts without registry access. Extract it and install the directory as is.
          - \`SHA256SUMS\`: checksums of both (\`sha256sum --check SHA256SUMS\`).
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Advanced Git ${VERSION}" \
            --notes-file "$notes_file" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/*.tgz dist/SHA256SUMS
